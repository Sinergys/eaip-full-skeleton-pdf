name: Docker Build & Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'services/**/Dockerfile'
      - 'services/**/*.py'
      - 'services/**/requirements.txt'
      - 'infra/docker-compose.yml'
      - '.github/workflows/docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Skip if only documentation files changed
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG=true
          else
            VERSION="latest"
            IS_TAG=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Docker Hub repository: ecosinergys/eaip-full-skeleton"
          echo "Version: $VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway-auth
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway-auth
          file: ./services/gateway-auth/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:gateway-auth-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:gateway-auth-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ingest
        uses: docker/build-push-action@v5
        with:
          context: ./services/ingest
          file: ./services/ingest/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:ingest-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:ingest-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push validate
        uses: docker/build-push-action@v5
        with:
          context: ./services/validate
          file: ./services/validate/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:validate-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:validate-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analytics
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics
          file: ./services/analytics/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:analytics-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:analytics-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push recommend
        uses: docker/build-push-action@v5
        with:
          context: ./services/recommend
          file: ./services/recommend/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:recommend-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:recommend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push reports
        uses: docker/build-push-action@v5
        with:
          context: ./services/reports
          file: ./services/reports/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:reports-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:reports-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push management
        uses: docker/build-push-action@v5
        with:
          context: ./services/management
          file: ./services/management/Dockerfile
          push: true
          tags: |
            ecosinergys/eaip-full-skeleton:management-${{ steps.meta.outputs.version }}
            ecosinergys/eaip-full-skeleton:management-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.meta.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:gateway-auth-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:ingest-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:validate-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:analytics-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:recommend-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:reports-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ecosinergys/eaip-full-skeleton:management-${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

