# Конфигурация батч-теста OCR модуля

# Общие настройки
batch:
  # Размер батча (количество файлов для обработки)
  size: 5
  
  # Пауза между файлами (секунды)
  pause_between_files: 10
  
  # Директория с тестовыми файлами
  test_files_dir: "C:\\AUDIT\\OBJECTS\\Navoiy IES\\INBOX"
  
  # Максимальный размер файла для теста (MB)
  max_file_size_mb: 5.0
  
  # Минимальный размер файла для теста (MB)
  min_file_size_mb: 0.0

# Настройки обработки
processing:
  # DPI для конвертации PDF в изображения
  # Рекомендуемые значения: 200 (быстро), 300 (качество)
  pdf_dpi: 200
  
  # Использовать предобработку изображений
  use_preprocessing: true
  
  # Использовать Gemini Vision OCR
  use_gemini_vision: true
  
  # Использовать Tesseract OCR (fallback)
  use_tesseract: false

# Настройки Gemini Vision
gemini:
  # Модель Gemini
  model: "gemini-2.0-flash"
  
  # Таймаут запроса (секунды)
  timeout_seconds: 600
  
  # Количество попыток при ошибке
  retry_attempts: 3
  
  # Базовое время задержки для экспоненциального backoff (секунды)
  backoff_base_seconds: 2

# Настройки предобработки изображений
preprocessing:
  # Улучшение контраста (множитель: 1.0 = без изменений, 1.5 = +50%)
  contrast_factor: 1.5
  
  # Улучшение резкости (множитель: 1.0 = без изменений, 1.3 = +30%)
  sharpness_factor: 1.3
  
  # Использовать нормализацию освещения
  normalize_illumination: true
  
  # Использовать удаление шумов
  denoise: true
  
  # Метод удаления шумов: "median", "gaussian", "bilateral"
  denoise_method: "median"
  
  # Использовать адаптивную бинаризацию
  binarize: true
  
  # Метод бинаризации: "otsu", "adaptive", "sauvola"
  binarization_method: "adaptive"
  
  # Использовать выравнивание (deskew)
  deskew: true

# Настройки логирования
logging:
  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # Сохранять промежуточные результаты после каждого файла
  save_intermediate_results: true
  
  # Сохранять сырые ответы Gemini для отладки
  save_gemini_raw_responses: false
  
  # Директория для сохранения результатов
  results_dir: "reports/ocr"

# Настройки отчетности
reporting:
  # Создавать подробный отчет
  create_detailed_report: true
  
  # Формат отчета: "markdown", "json", "both"
  report_format: "both"
  
  # Включать метрики производительности
  include_performance_metrics: true
  
  # Включать метрики качества
  include_quality_metrics: true

# Настройки валидации
validation:
  # Минимальный порог confidence для текста
  text_confidence_threshold: 0.30
  
  # Минимальный порог confidence для таблиц
  table_confidence_threshold: 0.70
  
  # Минимальный порог confidence для чисел
  numbers_confidence_threshold: 0.60
  
  # Минимальный порог confidence для дат
  dates_confidence_threshold: 0.80
  
  # Логировать low_confidence случаи
  log_low_confidence: true

# Список файлов для тестирования (приоритетные)
# Если список пуст, выбираются случайные файлы из test_files_dir
priority_files:
  - "счёт фактура.PDF"
  - "Акт выполненных работ-2 (1).PDF"
  - "акт выполненых работ май.PDF"
  - "ПДВ.pdf"
  - "акт выполненных работ (1).PDF"

# Исключения (файлы, которые не нужно тестировать)
exclude_files:
  - "*.xls"
  - "*.xlsx"
  - "*.docx"
  - "*.doc"

# Настройки параллельной обработки (для будущей реализации)
parallel:
  # Использовать параллельную обработку страниц
  enabled: false
  
  # Количество потоков для параллельной обработки
  max_workers: 3
  
  # Максимальное количество страниц для параллельной обработки
  max_pages_per_file: 10

